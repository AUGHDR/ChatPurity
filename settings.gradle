pluginManagement {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.kikugie.dev/snapshots'; name = 'KikuGie Snapshots' }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.8.3'
}

stonecutter {
    create(rootProject) {
        versions('1.20.6', '1.21.11')
        vcsVersion = '1.21.11'
    }
}

rootProject.name = 'ChatPurity'