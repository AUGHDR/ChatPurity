# ChatPurity 规则配置文件
# 
# 用于设置刷屏后的惩罚规则
# 每个规则可以设置不同的模式和时间

# ========== 规则配置 ==========
# 模式说明：
# - mute: 禁言玩家
# - kick: 踢出玩家
# - ban: 封禁玩家
# - block: 仅屏蔽消息（不执行任何惩罚操作）
rules:
  # 示例1：禁言模式（可设置禁言时间，-1为永久）
  - mode: mute
    time: 10min
    message: "你因刷屏被禁言 10分钟"
  
  # 示例2：踢出模式
  - mode: kick
    message: "你因刷屏被踢出服务器"
  
  # 示例3：封禁模式（可设置封禁时间，-1为永久）
  - mode: ban
    time: 1d
    message: "你因刷屏被封禁 1天"
  
  # 示例4：仅屏蔽模式（不执行惩罚操作，只屏蔽消息）
  - mode: block
    message: "你的消息因刷屏被屏蔽"

# 时间单位说明：
# - 无单位或 s: 秒
# - min: 分钟
# - h: 小时
# - d: 天
# - -1: 永久（仅适用于 mute 和 ban 模式）