# ChatPurity 同音字库配置文件
# 
# 说明：
# - 本配置文件用于设置同音词检测的同音字库
# - 格式：拼音: [同音字1, 同音字2, 同音字3, ...]
# - 使用 # 添加注释
# - 修改配置后使用 /chatpurity reload 命令重载

# ========== 同音字库 ==========
# 格式：拼音: [同音字列表]
# 
# 示例：
# - shi: [是, 事, 实, 市, 试, 视, 室, 拾, 识, 适, 始, 式, 势, 世, 嗜, 逝, 释, 饰, 氏, 示, 士, 仕, 侍, 嗜, 拭]
# - wo: [我, 卧, 握, 沃, 斡, 翰]
# - ni: [你, 泥, 尼, 呢, 拟]
#
# 使用说明：
# - 每个拼音对应一组同音字
# - 在黑名单中使用 homophone 模式时，会自动匹配同音字
# - 可以添加或删除同音字来自定义检测规则

