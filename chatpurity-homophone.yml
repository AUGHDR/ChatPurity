# ========== 使用说明 ==========
# 
# 1. 格式：拼音: [同音字1, 同音字2, 同音字3, ...]
# 2. 示例：
#    shi: [是, 事, 实, 市, 试, 视, 室, 拾, 识, 适, 始, 式, 势, 世]
# 
# 3. 如何添加新的同音字：
#    - 找到对应的拼音
#    - 在对应的行添加新的同音字
#    - 如果拼音不存在，创建新的一行
# 
# 4. 如何删除同音字：
#    - 从对应的列表中删除不需要的字
# 
# 5. 保存后使用 /chatpurity reload 命令重载配置