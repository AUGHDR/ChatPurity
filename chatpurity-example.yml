# ========== 使用说明 ==========
# 
# 1. 格式：拼音: [同音字1, 同音字2, 同音字3, ...]
# 2. 示例：
#    shi: [是, 事, 实, 市, 试, 视, 室, 拾, 识, 适, 始, 式, 势, 世, 嗜, 逝, 释, 饰, 氏, 示, 士, 仕, 侍, 嗜, 拭]
# 
# 3. 如何添加新的同音字：
#    - 找到对应的拼音
#    - 在对应的行添加新的同音字
#    - 如果拼音不存在，创建新的一行
# 
# 4. 如何删除同音字：
#    - 从对应的列表中删除不需要的字
# 
# 5. 保存后使用 /chatpurity reload 命令重载配置
#
# 
# 提示：
# - 每个拼音对应一组同音字
# - 在黑名单中使用 homophone 模式时，会自动匹配同音字
# - 可以添加或删除同音字来自定义检测规则
# - 格式必须严格按照 YAML 格式
# 
# 配置文件位置：config/chatpurity.yml
# 修改后使用 /chatpurity reload 命令重载配置