# ChatPurity 聊天过滤模组配置文件
# 
# 配置说明：
# - 本配置文件用于设置白名单、黑名单和替换词规则
# - 使用 # 添加注释
# - 修改配置后使用 /chatpurity reload 命令重载

# ========== 基础设置 ==========
# 是否启用白名单
enable_whitelist: true

# 是否启用黑名单
enable_blacklist: true

# 是否忽略大小写
ignore_case: true

# 是否启用调试模式（会在控制台输出详细日志）
debug_mode: false

# ========== 防刷屏设置 ==========
# 是否启用防刷屏功能
enable_anti_spam: false

# 刷屏判定：在指定时间窗口内发送的最大消息数
anti_spam_max_messages: 5

# 刷屏判定：时间窗口（秒）
anti_spam_time_window: 5

# 刷屏后执行的操作（如果使用规则配置，此项将被忽略）：mute（禁言）、kick（踢出）、ban（封禁）
anti_spam_action: mute

# 操作持续时间（如果使用规则配置，此项将被忽略，-1为永久），支持时间单位：s（秒）、min（分钟）、h（小时）、d（天）
anti_spam_action_time: 10min

# ========== 防刷屏规则配置 ==========
# 可以配置多个规则，按顺序执行
# 如果配置了规则，将优先使用规则而不是上面的 anti_spam_action 和 anti_spam_action_time
# 
# 模式说明：
# - mute: 禁言玩家（需要设置 time 参数）
# - kick: 踢出玩家
# - ban: 封禁玩家（需要设置 time 参数）
# - block: 仅屏蔽消息（不执行任何惩罚操作）
# 
# 参数说明：
# - mode: 操作模式
# - time: 持续时间（仅 mute 和 ban 需要，-1 为永久）
# - message: 提示消息
anti_spam_rules:
  # 示例1：仅屏蔽模式（不执行惩罚操作，只屏蔽消息）
  - mode: block
    message: "你的消息因刷屏被屏蔽"
  
  # 示例2：禁言模式（禁言10分钟）
  # - mode: mute
  #   time: 10min
  #   message: "你因刷屏被禁言 10分钟"
  
  # 示例3：踢出模式
  # - mode: kick
  #   message: "你因刷屏被踢出服务器"
  
  # 示例4：封禁模式（封禁1天）
  # - mode: ban
  #   time: 1d
  #   message: "你因刷屏被封禁 1天"
  
  # 示例5：永久禁言
  # - mode: mute
  #   time: -1
  #   message: "你因刷屏被永久禁言"
  
  # 示例6：永久封禁
  # - mode: ban
  #   time: -1
  #   message: "你因刷屏被永久封禁"

# ========== 白名单 ==========
# 白名单中的词不会被屏蔽
whitelist:
  # 示例：
  # - "游戏"
  # - "Minecraft"
  # - "服务器"

# ========== 黑名单 ==========
# 黑名单格式：词: 模式（YAML Map 格式）
# 
# 模式说明：
# - 无模式或空字符串：包含检测，只要包含指定词就屏蔽
# - homophone：同音词检测，检测同音词、同音字
# - pinyin_abbr：拼音缩写检测，检测拼音首字母缩写（如"傻逼"会匹配"sb"）
# - pinyin_full：完整拼音检测，检测完整拼音（如"傻逼"会匹配"shabi"）
# - exact_match：精确匹配，只检测完全相同的词或重复词
# - [词1,词2,词3]：组合词检测，必须包含所有指定的词
# - op1/op2/op3/op4：OP权限控制
# 
# OP权限说明：
# - op1：OP1及以下会被屏蔽，OP2/3/4可发送
# - op2：OP2及以下会被屏蔽，OP3/4可发送
# - op3：OP3及以下会被屏蔽，OP4可发送
# - op4：所有人都会被屏蔽（包括OP4）
# 
# 模式叠加：多个模式用冒号分隔，例如：homophone:pinyin_abbr:pinyin_full:op2
blacklist: {}
  # 示例1：默认包含检测（空字符串表示默认模式）
  # 广告: ""
  
  # 示例2：同音词检测
  # 傻逼: homophone
  
  # 示例3：拼音缩写检测（"sb"也会被屏蔽）
  # 傻逼: pinyin_abbr
  
  # 示例4：完整拼音检测（"shabi"也会被屏蔽）
  # 傻逼: pinyin_full
  
  # 示例5：同音词 + 拼音缩写 + 完整拼音检测
  # 傻逼: homophone:pinyin_abbr:pinyin_full
  
  # 示例6：精确匹配（屏蔽 "L" 和 "LLL" 等，但不屏蔽 "LoL"）
  # L: exact_match
  
  # 示例7：组合词检测（必须包含"我"、"喜"、"欢"三个字）
  # "[我,喜,欢]": ""
  
  # 示例8：组合词 + 同音词检测
  # "[我,喜,欢]": homophone
  
  # 示例9：OP权限控制（OP2及以下会被屏蔽，OP3/4可发送）
  # 管理工具: op2
  
  # 示例10：同音词 + 拼音缩写 + 完整拼音 + OP2
  # 傻逼: homophone:pinyin_abbr:pinyin_full:op2

# ========== 替换词 ==========
# 替换词格式：原词: 替换词（YAML Map 格式）
# 如需指定模式，格式为：原词:模式: 替换词
# 
# 模式说明：
# - 无模式（默认）：直接替换所有出现的字符/词
# - exact_match：精确替换，只有消息中只有指定字符才替换
# - homophone：同音词替换，检测同音词、同音字后替换
# - pinyin_abbr：拼音缩写替换，检测拼音首字母缩写后替换（如"wc"替换为"**"）
# - pinyin_full：完整拼音替换，检测完整拼音后替换（如"wocao"替换为"**"）
# - [词1,词2,词3]：组合词替换，检测是否包含所有指定的词后替换
# - op1/op2/op3/op4：OP权限控制（OPn以上不会被替换）
# 
# OP权限说明：
# - op1：OP1及以下会被替换，OP2/3/4不会被替换
# - op2：OP2及以下会被替换，OP3/4不会被替换
# - op3：OP3及以下会被替换，OP4不会被替换
# - op4：所有人都会被替换（包括OP4）
# 
# 模式叠加：多个模式用冒号分隔，例如：homophone:pinyin_abbr:pinyin_full:op2
replacements: {}
  # 示例1：默认替换（直接替换所有 "L" 为 "Love"）
  # L: Love
  
  # 示例2：同音词替换（如 "卧槽" 替换为 "***"）
  # 卧槽:homophone: "***"
  
  # 示例3：拼音缩写替换（"wc" 替换为 "***"）
  # 卧槽:pinyin_abbr: "***"
  
  # 示例4：完整拼音替换（"wocao" 替换为 "***"）
  # 卧槽:pinyin_full: "***"
  
  # 示例5：同音词 + 拼音缩写 + 完整拼音替换
  # 卧槽:homophone:pinyin_abbr:pinyin_full: "***"
  
  # 示例6：组合词替换（包含"我"、"喜"、"欢"则替换为"超级喜欢"）
  # "[我,喜,欢]": 超级喜欢
  
  # 示例7：组合词 + 同音词
  # "[我,喜,欢]":homophone: 超级喜欢
  
  # 示例8：OP权限控制（OP2及以下会被替换，OP3/4不会）
  # 卧槽:op2: "***"

# ========== 默认OP等级 ==========
# 默认情况下，黑名单和替换词的OP权限要求为 OP4
# 可以通过在模式中添加 op1/op2/op3/op4 来修改

# ========== 禁言玩家 ==========
# 被禁言的玩家列表（自动生成，无需手动编辑）
# 格式：玩家名: 解禁时间戳（毫秒）- YAML Map 格式
# 命令格式: /chatpurity mute add <玩家> <时间>
# 时间单位:
#   - 无单位或 s: 秒
#   - min: 分钟
#   - h: 小时
#   - d: 天
# 示例:
#   /chatpurity mute add player123 10s    # 禁言10秒
#   /chatpurity mute add player123 5min   # 禁言5分钟
#   /chatpurity mute add player123 2h     # 禁言2小时
#   /chatpurity mute add player123 1d     # 禁言1天
muted_players: {}
  # 示例（自动生成）：
  # player123: 1234567890000

# ========== 刷屏玩家计数 ==========
# 玩家消息计数（自动生成，无需手动编辑）
player_message_count:

# ========== 谐音字库 ==========
# 格式：拼音: [同音字列表]
# 
# 说明：
# - 本配置文件用于设置同音词检测的同音字库
# - 每个拼音对应一组同音字
# - 在黑名单中使用 homophone 模式时，会自动匹配同音字
# - 可以添加或删除同音字来自定义检测规则
# 
# 示例：
# shi: [是, 事, 实, 市, 试, 视, 室, 拾, 识, 适, 始, 式, 势, 世, 嗜, 逝, 释, 饰, 氏, 示, 士, 仕, 侍, 嗜, 拭]
# wo: [我, 卧, 握, 沃, 斡, 翰]
# ni: [你, 泥, 尼, 呢, 拟]
# 
# 如何添加新的同音字：
# 1. 找到对应的拼音
# 2. 在对应的行添加新的同音字
# 3. 如果拼音不存在，创建新的一行
# 
# 如何删除同音字：
# - 从对应的列表中删除不需要的字
# 
# 保存后使用 /chatpurity reload 命令重载配置

